name: Public Showcase Safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-safety:
    name: Validate disclosure-safe showcase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate showcase manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^repository_class: public-showcase$' .osystic/repository.yml
          grep -q '^visibility: public$' .osystic/repository.yml
          grep -q '^  publisher: OSYSTIC$' .osystic/repository.yml
          grep -q '^  presentation_standard: company-engineering-case-study$' .osystic/repository.yml
          grep -q '^  source_code_included: false$' .osystic/repository.yml
          grep -q '^  recovery_audit_reviewed: true$' .osystic/repository.yml
          grep -q '^  branded_as_osystic: true$' .osystic/repository.yml
          grep -q '^  reuse_boundary_defined: true$' .osystic/repository.yml
          grep -q '^  open_source_license_granted: false$' .osystic/repository.yml
          grep -q '^  contact_information_included: false$' .osystic/repository.yml
          grep -q '^  credentials_included: false$' .osystic/repository.yml
          grep -q '^  recovered_private_artifacts_included: false$' .osystic/repository.yml
          grep -q '^  independent_git_history: true$' .osystic/repository.yml

      - name: Confirm required public artifacts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            case-study.md
            SECURITY.md
            NOTICE.md
            assets/architecture.svg
            assets/validation.svg
            docs/technical-overview.md
            docs/research-evolution.md
            docs/lessons-learned.md
            docs/repository-hardening.md
            docs/validation-evidence.md
            docs/disclosure-boundary.md
            docs/standardization-acceptance.md
            .osystic/repository.yml
            .github/CODEOWNERS
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required public artifact: $path"; exit 1; }
          done

      - name: Reject confidential implementation and delivery artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(py|ipynb|pkl|joblib|csv|parquet|zip|7z|rar|pdf|txt|docx|xlsx|xls|pptx|mq4|ex4|mq5|ex5|pine|js|ts|cpp|c|h)$'; then
            echo 'Implementation, dataset, model, archive, report, office document, or executable artifact detected in public showcase.'
            exit 1
          fi

      - name: Reject source disguised as documentation
        shell: bash
        run: |
          set -euo pipefail
          if git grep -FIn -e '//@version=' -e 'indicator("' -e 'strategy("' -- ':!.github/workflows/public-safety.yml'; then
            echo 'TradingView implementation source marker detected in public showcase.'
            exit 1
          fi

      - name: Scan text for likely secrets or contact details
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' path; do
            case "$path" in
              *.svg|*.png|*.jpg|*.jpeg|*.gif) ;;
              *) files+=("$path") ;;
            esac
          done < <(git ls-files -z)
          if ((${#files[@]})) && grep -EIn --binary-files=without-match \
            '([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9_-]{20,}|(api[_-]?key|token|password|secret)[[:space:]]*[:=][[:space:]]*["'\''`]?[A-Za-z0-9_./+-]{20,}' \
            "${files[@]}"; then
            echo 'Potential contact detail or secret detected.'
            exit 1
          fi

      - name: Confirm disclosure and company presentation language
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'OSYSTIC ENGINEERING CASE STUDY · PUBLIC SHOWCASE · SANITIZED · PORTFOLIO-SAFE' README.md
          grep -Fq 'Company showcase classification' README.md
          grep -Fq 'Public vs. private repository boundary' README.md
          grep -Fq 'independent Git history' README.md
          grep -Fq 'Post-closure evidence governance' README.md
          grep -Fq 'Artifact recovery needs authority checks' docs/lessons-learned.md
          grep -Fq 'Copyright © 2026 OSYSTIC (PRIVATE) LIMITED. All rights reserved.' NOTICE.md
          grep -Fq 'No open-source license is granted' NOTICE.md
          grep -Fq 'attribute it to **OSYSTIC**' NOTICE.md

      - name: Reject obvious private-material markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -EIn -e '/content/drive/MyDrive' -e 'private-user-images\.githubusercontent\.com' -e 'freelancer\.com/projects/' -- ':!.github/workflows/public-safety.yml'; then
            echo 'Private-delivery or environment-specific marker detected.'
            exit 1
          fi
