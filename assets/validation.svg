<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Validation layers</title>
  <desc id="desc">Repository, syntax, unit, smoke, and public disclosure validation layers.</desc>
  <rect width="1200" height="420" rx="24" fill="#0d1117"/>
  <text x="600" y="54" text-anchor="middle" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="28" font-weight="700">Validation Layers</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#161b22" stroke="#3fb950" stroke-width="2">
      <rect x="55" y="120" width="190" height="115" rx="16"/>
      <rect x="280" y="120" width="190" height="115" rx="16"/>
      <rect x="505" y="120" width="190" height="115" rx="16"/>
      <rect x="730" y="120" width="190" height="115" rx="16"/>
      <rect x="955" y="120" width="190" height="115" rx="16"/>
    </g>
    <g fill="#f0f6fc" font-size="18" font-weight="700">
      <text x="150" y="157">Repository</text><text x="150" y="181">invariants</text>
      <text x="375" y="157">Syntax</text><text x="375" y="181">validation</text>
      <text x="600" y="157">Unit</text><text x="600" y="181">tests</text>
      <text x="825" y="157">Offline</text><text x="825" y="181">smoke</text>
      <text x="1050" y="157">Public</text><text x="1050" y="181">safety</text>
    </g>
    <g fill="#8b949e" font-size="14">
      <text x="150" y="211">structure + governance</text>
      <text x="375" y="211">maintained Python</text>
      <text x="600" y="211">data + time split</text>
      <text x="825" y="211">synthetic pipeline</text>
      <text x="1050" y="211">disclosure boundary</text>
    </g>
  </g>
  <path d="M150 270 H1050" stroke="#8b949e" stroke-width="3"/>
  <circle cx="150" cy="270" r="7" fill="#3fb950"/><circle cx="375" cy="270" r="7" fill="#3fb950"/><circle cx="600" cy="270" r="7" fill="#3fb950"/><circle cx="825" cy="270" r="7" fill="#3fb950"/><circle cx="1050" cy="270" r="7" fill="#3fb950"/>
  <text x="600" y="325" text-anchor="middle" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="18">Each layer proves only what can be tested deterministically at that boundary.</text>
  <text x="600" y="358" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="15">No layer is presented as proof of future profitability or live execution performance.</text>
</svg>
